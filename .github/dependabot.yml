# Keeps dependencies, the base image and the pipeline's actions up to date. Each pull request goes
# through the full CI gates before it can merge.
#
# Major versions are NOT proposed automatically: moving to Spring Boot 4 or to a new Java release is
# a planned change with its own testing, not a weekly bump. Java stays on the 21 LTS line.
# Security updates (Dependabot alerts) are not affected by these rules and are always proposed.
version: 2
updates:
  - package-ecosystem: maven
    directory: /practical
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /practical
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Stay on the Java 21 LTS line; patch updates of the 21 image are still proposed.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
