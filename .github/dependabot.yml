# Keeps dependencies, the base image and the pipeline's actions up to date with weekly pull
# requests; each one goes through the full CI gates before it can merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /practical
    schedule:
      interval: weekly
    groups:
      spring:
        patterns:
          - "org.springframework*"

  - package-ecosystem: docker
    directory: /practical
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
