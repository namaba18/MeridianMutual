# CD: dev -> test -> prod. Defined, NOT executed in this assessment (nothing is deployed).
#
#   build  -> deploy dev -> deploy test -> plan prod -> [approval] -> deploy prod
#
# - Runs on every merge to main (CI has already passed on the pull request).
# - The same image, tagged with the commit SHA, is promoted through every environment: what reaches
#   prod is exactly what was tested.
# - Infrastructure changes travel with the application in the same Bicep deployment.
# - Prod shows its what-if BEFORE the approval, so reviewers approve a concrete plan.
# - Rollback: run this workflow manually with the image tag of the last good commit.
# - Switched off until the repository variable CD_ENABLED is "true" (set once the Azure identities
#   and GitHub environments exist): until then every job is skipped, never failed.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image-tag:
        description: Redeploy an existing image tag (commit SHA), e.g. to roll back. Empty = build this commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# Never two deployments at once; never cancel one half-way.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    if: vars.CD_ENABLED == 'true' && !inputs.image-tag
    runs-on: ubuntu-latest
    environment: build # holds the identity allowed to push to the shared registry
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: practical
        run: ./mvnw -B -ntp verify
      - id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push to the shared registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          image="${{ vars.ACR_NAME }}.azurecr.io/payment-intake:${{ github.sha }}"
          docker build -t "$image" practical
          docker push "$image"

  resolve-tag:
    name: Resolve image tag
    needs: build
    if: always() && vars.CD_ENABLED == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=${{ inputs.image-tag || needs.build.outputs.image-tag }}" >> "$GITHUB_OUTPUT"

  dev:
    needs: resolve-tag
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github-environment: dev
      params: dev
      image-tag: ${{ needs.resolve-tag.outputs.value }}
      apply: true

  test:
    needs: [resolve-tag, dev]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github-environment: test
      params: test
      image-tag: ${{ needs.resolve-tag.outputs.value }}
      apply: true

  plan-prod:
    needs: [resolve-tag, test]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github-environment: prod-plan # read-only identity (Reader + what-if), no approval
      params: prod
      image-tag: ${{ needs.resolve-tag.outputs.value }}
      apply: false

  prod:
    needs: [resolve-tag, plan-prod]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github-environment: production # required reviewers: the approval gate
      params: prod
      image-tag: ${{ needs.resolve-tag.outputs.value }}
      apply: true
