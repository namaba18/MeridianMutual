# Reusable: plan (what-if) and, optionally, deploy infrastructure + apps to ONE environment.
# Called by cd.yml. Infrastructure and application go out together in a single Bicep deployment,
# so an environment is always described by one commit.
#
# Authentication: OpenID Connect. The job asks GitHub for a short-lived token and exchanges it for
# an Azure token; there is no stored Azure secret. Each GitHub environment has its own Entra
# identity, trusted only for that environment (federated credential subject
# repo:<owner>/<repo>:environment:<name>), with rights on that environment's resource group only.
name: Deploy environment

on:
  workflow_call:
    inputs:
      github-environment:
        description: GitHub environment (holds the Azure identifiers and the protection rules)
        required: true
        type: string
      params:
        description: Parameter file in infra/params, without extension (dev, test, prod)
        required: true
        type: string
      image-tag:
        description: Image tag to deploy (a commit SHA)
        required: true
        type: string
      apply:
        description: false = what-if only
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.apply && 'Deploy' || 'Plan' }} ${{ inputs.params }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    timeout-minutes: 45
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PARAMS_FILE: infra/params/${{ inputs.params }}.bicepparam
      IMAGE_TAG: ${{ inputs.image-tag }} # read by the .bicepparam files
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure CLI
        # The containerapp commands live in an extension; never prompt in a pipeline.
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade --only-show-errors

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$PARAMS_FILE" \
            --exclude-change-types NoChange Ignore \
            --no-pretty-print > whatif.json
          {
            echo "## What-if: ${{ inputs.params }} (image ${IMAGE_TAG})"
            echo '```'
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters "$PARAMS_FILE" \
              --exclude-change-types NoChange Ignore
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard against deletions
        # The template never deletes on its own (incremental mode), but a what-if showing a Delete
        # means someone changed the environment by hand. Stop and let a person look.
        run: |
          if jq -e '[.changes[] | select(.changeType == "Delete")] | length > 0' whatif.json > /dev/null; then
            echo "::error::What-if reports deletions in ${{ inputs.params }}. Review the plan before deploying."
            exit 1
          fi

      - name: Deploy
        if: inputs.apply
        run: |
          az deployment group create \
            --name "payments-${{ github.run_number }}-${{ github.run_attempt }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$PARAMS_FILE" \
            --mode Incremental

      - name: Verify the new revisions are healthy
        if: inputs.apply
        # The apps are internal, so the runner cannot call them; the platform's own health state
        # (driven by the liveness and readiness probes) is checked instead.
        run: |
          # Healthy: probes pass. None: no replica running, e.g. payment-ops scaled to zero in dev.
          # Unhealthy, Failed or Degraded: stop.
          apps=$(az containerapp list --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv)
          for app in $apps; do
            for attempt in $(seq 1 20); do
              read -r provisioning health running < <(az containerapp revision list \
                --name "$app" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.active] | [0].[properties.provisioningState, properties.healthState, properties.runningState]" \
                -o tsv)
              echo "$app: provisioning=$provisioning health=$health running=$running"
              if [ "$provisioning" = "Failed" ] || [ "$health" = "Unhealthy" ] \
                 || [ "$running" = "Failed" ] || [ "$running" = "Degraded" ]; then
                echo "::error::$app is not healthy. Roll back by re-running CD with the previous image tag."
                exit 1
              fi
              if [ "$provisioning" = "Provisioned" ] && { [ "$health" = "Healthy" ] || [ "$health" = "None" ]; }; then
                break
              fi
              if [ "$attempt" = "20" ]; then
                echo "::error::$app did not become ready in 10 minutes. Roll back by re-running CD with the previous image tag."
                exit 1
              fi
              sleep 30
            done
          done
